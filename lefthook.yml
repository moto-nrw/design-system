pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    typecheck:
      run: pnpm tsc --noEmit

pre-push:
  parallel: true
  commands:
    test:
      run: pnpm test:run
    build:
      run: pnpm build
