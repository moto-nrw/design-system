version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: development
    open-pull-requests-limit: 10
    groups:
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "jsdom"
      build-tools:
        patterns:
          - "tsup"
          - "typescript"
          - "style-dictionary"
          - "@arethetypeswrong/*"
          - "publint"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: development
